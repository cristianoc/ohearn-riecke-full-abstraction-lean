name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: lean --version

      - name: Resolve dependencies
        run: lake update

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build formalisation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation
          lake --no-ansi build 2>&1 | tee .validation/build.log

      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validation
          lake env lean OR/AxiomAudit.lean 2>&1 | tee .validation/axioms.log
          python3 scripts/check_axioms.py .validation/axioms.log

      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: .validation/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
