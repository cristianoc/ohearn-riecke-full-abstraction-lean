name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: lean --version

      - name: Resolve dependencies
        run: lake update

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build formalisation
        run: lake --no-ansi build

      - name: Axiom audit
        run: lake env lean OR/AxiomAudit.lean
