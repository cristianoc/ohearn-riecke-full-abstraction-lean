name: Vendor reference paper
# One-shot archival workflow; remove after the PDF is committed.

on:
  push:
    paths:
      - .github/workflows/vendor-paper.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download paper from Syracuse SURFACE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper
          url='https://surface.syr.edu/cgi/viewcontent.cgi?article=1002&context=lcsmith_other'
          curl -fL --retry 4 --retry-delay 2 \
            -A 'Mozilla/5.0 (GitHub Actions; scholarly archival fetch)' \
            -e 'https://surface.syr.edu/lcsmith_other/3/' \
            "$url" \
            -o paper/OHearn_Riecke_1995_Kripke_Logical_Relations_and_PCF.pdf
          test "$(head -c 5 paper/OHearn_Riecke_1995_Kripke_Logical_Relations_and_PCF.pdf)" = '%PDF-'
          sha256sum paper/OHearn_Riecke_1995_Kripke_Logical_Relations_and_PCF.pdf > paper/SHA256SUMS

      - name: Record provenance
        shell: bash
        run: |
          cat > paper/README.md <<'EOF'
          # Reference paper

          This directory vendors the copy of:

          Peter W. O'Hearn and Jon G. Riecke, **Kripke Logical Relations and PCF**,
          *Information and Computation* 120(1), 107--116 (1995).
          DOI: https://doi.org/10.1006/inco.1995.1103

          ## Exact source used

          The PDF in this directory was downloaded from **SURFACE, the institutional
          repository of Syracuse University**, from the repository record:

          https://surface.syr.edu/lcsmith_other/3/

          Direct download endpoint used by the archival workflow:

          https://surface.syr.edu/cgi/viewcontent.cgi?article=1002&context=lcsmith_other

          SURFACE identifies the item as the 1995 article by Peter W. O'Hearn
          (Syracuse University) and John G. Riecke (AT&T Bell Laboratories), and
          labels the repository item with a Creative Commons Attribution 3.0 licence.

          Retrieval date: 2026-09-27.

          SHA256SUMS records the checksum of the exact PDF committed here.
          Formalisation comparisons should cite this vendored file and, where useful,
          the numbered definitions/lemmas/theorems in this version.
          EOF

      - name: Commit vendored paper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/
          git diff --cached --quiet && exit 0
          git commit -m 'Vendor O’Hearn–Riecke reference paper from Syracuse SURFACE'
          git push
